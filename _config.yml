# ============================================================
#  Hexo 站点配置 — 心情如歌
# ============================================================

# 站点
title: 心情如歌
subtitle: '一些安静的记录'
description: '关于代码、生活与一切值得留痕的事。'
keywords:
  - 技术
  - 随笔
  - 博客
author: kmsy7619
language: zh-CN
timezone: Asia/Shanghai

# 地址
url: https://761009.xyz
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# 首页
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类 & 标签
default_category: uncategorized

# 不输出 "Powered by Hexo"
meta_generator: false

# 时间格式
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'mtime'

# 分页
per_page: 10
pagination_dir: page

# 主题
theme: anzhiyu

# 部署
deploy:
  type: git
  repository: https://github.com/kmsy7619/azyblog.git
  branch: gh-pages
  message: 'deploy: 更新静态站点'
